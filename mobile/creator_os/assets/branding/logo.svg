<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="pinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="cameraBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="stickerGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer Sticker Border -->
  <g filter="url(#stickerGlow)">
    <!-- Sparkles and cute bursts -->
    <path d="M 18 28 C 16 26 15 22 17 20 C 19 18 23 19 25 21 C 27 23 26 27 24 29 C 22 31 20 30 18 28 Z" fill="#ffffff" />
    <path d="M 28 15 C 26 13 25 9 27 7 C 29 5 33 6 35 8 C 37 10 36 14 34 16 C 32 18 30 17 28 15 Z" fill="#ffffff" />
    
    <!-- Sparkle Stars Right -->
    <path d="M 98 42 L 102 34 L 110 30 L 102 26 L 98 18 L 94 26 L 86 30 L 94 34 Z" fill="#ffffff" />
    <path d="M 104 55 L 107 50 L 112 48 L 107 46 L 104 41 L 101 46 L 96 48 L 101 50 Z" fill="#ffffff" />
    
    <!-- Little Heart Right -->
    <path d="M 92 58 C 88 54 84 57 84 62 C 84 67 92 74 92 74 C 92 74 100 67 100 62 C 100 57 96 54 92 58 Z" fill="#f472b6" stroke="#ffffff" stroke-width="2" />
    
    <!-- White Sticker Outline for Camera -->
    <rect x="18" y="24" width="84" height="66" rx="20" fill="#ffffff" stroke="#ffffff" stroke-width="6" stroke-linejoin="round" />
    
    <!-- Flash/Button top lumps -->
    <rect x="28" y="16" width="18" height="12" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="3" />
    <rect x="74" y="16" width="18" height="12" rx="4" fill="#0f172a" stroke="#ffffff" stroke-width="3" />

    <!-- Camera Top Half (Pastel Pink) -->
    <path d="M 22 42 L 22 40 C 22 30 30 22 40 22 L 80 22 C 90 22 98 30 98 40 L 98 42 Z" fill="#fda4af" />
    <!-- Camera Bottom Half (Deep Blue/Navy) -->
    <path d="M 22 42 L 98 42 L 98 76 C 98 84 90 90 80 90 L 40 90 C 30 90 22 84 22 76 Z" fill="url(#cameraBody)" />

    <!-- Viewfinder on Top Left -->
    <rect x="28" y="30" width="12" height="8" rx="2" fill="#1e1b4b" stroke="#ffffff" stroke-width="1.5" />
    
    <!-- Small Pink Sensor Dot Bottom Left -->
    <circle cx="32" cy="78" r="4.5" fill="#f43f5e" />

    <!-- Big Lens Center -->
    <circle cx="60" cy="56" r="24" fill="#ffffff" />
    <circle cx="60" cy="56" r="20" fill="#090d16" />
    <circle cx="60" cy="56" r="16" fill="#1e293b" />
    <circle cx="60" cy="56" r="11" fill="#0f172a" />
    <!-- Lens Reflection Ring -->
    <circle cx="56" cy="52" r="4" fill="#ffffff" opacity="0.8" />
  </g>
</svg>
